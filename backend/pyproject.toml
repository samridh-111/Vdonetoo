[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "ivr-automation-backend"
version = "0.1.0"
description = "Internal Automation Hub — Batch IVR Automation backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "supabase>=2.10.0",
    "openai>=1.55.0",
    "google-genai>=1.2.0",
    "elevenlabs>=1.13.0",
    "langdetect>=1.0.9",
    "rapidfuzz>=3.10.1",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# celery's task decorator is untyped, which under `strict` would otherwise
# force `# type: ignore` on every single @celery_app.task-decorated function.
[[tool.mypy.overrides]]
module = ["app.core.celery_app", "app.workers.tasks.*"]
disallow_untyped_decorators = false
